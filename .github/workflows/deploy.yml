# StreamDojo CI/CD
#   Pull requests -> checks only (lint + tests), NO AWS access
#   Push to main  -> checks, then validate, build and deploy with SAM (OIDC, no keys)
name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test tools
        run: pip install -r requirements-dev.txt
      - name: Lint CloudFormation / SAM templates
        run: cfn-lint template.yaml bootstrap/*.yaml
      - name: Run unit tests
        run: pytest -q

  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # lets this job request a GitHub OIDC token for AWS
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - name: Get temporary AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Validate template
        run: sam validate --lint
      - name: Build
        run: sam build
      - name: Deploy
        # --role-arn: CloudFormation creates resources with its own execution role
        # AlertEmail comes from a secret so the address is never in the public repo
        run: >
          sam deploy
          --no-confirm-changeset
          --no-fail-on-empty-changeset
          --role-arn ${{ secrets.AWS_CFN_EXEC_ROLE_ARN }}
          --parameter-overrides "Environment=dev AlertEmail=${{ secrets.ALERT_EMAIL }}"

      - name: Publish website
        # Read the stack outputs, write web/config.json (sign-in settings, no secrets),
        # upload the site and clear CloudFront's cache so everyone gets the new version
        run: |
          output() {
            aws cloudformation describe-stacks --stack-name streamdojo-dev \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          BUCKET=$(output SiteBucketName)
          DISTRIBUTION=$(output SiteDistributionId)
          cat > web/config.json <<EOF
          {
            "apiBase": "/api",
            "region": "eu-west-2",
            "cognitoDomain": "$(output CognitoDomain)",
            "clientId": "$(output UserPoolClientId)"
          }
          EOF
          aws s3 sync web/ "s3://$BUCKET/" --delete
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths "/*"

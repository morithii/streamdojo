<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreamDojo Architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: an AWS reference-architecture sheet - calm, exact, no decoration.
   IDEA: the diagram you'd find in an AWS whitepaper, but you can zoom into each numbered box.
   PICTURE: one white drawing board with the AWS Cloud and Region frames, official icons, thin dark lines, black step numbers.
   COLOUR and TYPE: white board, AWS squid-ink #232F3E lines, the official icon colours only; Inter at 4 sizes.
   LAYOUT: board left (most of the width), step list right; stacks below 980px. */
:root{color-scheme:light dark;--bg:light-dark(#f2f3f3,#0f141a);--ink:light-dark(#16191f,#e9ebed);--muted:light-dark(#545b64,#a7b0ba);
  --line:light-dark(#d5dbdb,#2c3440);--panel:light-dark(#fff,#161d26);--link:light-dark(#0972d3,#5ea6ff)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:18px max(3vw,16px) 6px;max-width:1560px;margin:0 auto}
h1{font-size:22px;line-height:1.2;margin:0;font-weight:700;letter-spacing:-.01em}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.crumbs button{all:unset;cursor:pointer;color:var(--link);padding:6px 2px;border-radius:4px}
.crumbs button:focus-visible,.go:focus-visible,.card:focus-visible{outline:2px solid #ff9900;outline-offset:2px}
.crumbs b{color:var(--ink);font-weight:600}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;padding:10px max(3vw,16px) 28px;max-width:1560px;margin:0 auto}
.board{align-self:start;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px;overflow:hidden}
.board svg{display:block;width:100%;height:auto}
#stage{transform-box:view-box}
aside{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px 20px;align-self:start}
aside h2{font-size:18px;line-height:1.3;margin:0 0 6px}
aside p{margin:0 0 12px;color:var(--muted)}
ol.steps{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:10px}
ol.steps li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start;font-size:14px;cursor:default}
.num{width:22px;height:22px;border-radius:50%;background:#232f3e;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:1px}
:root[data-theme=dark] .num{background:#e9ebed;color:#16191f}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .num{background:#e9ebed;color:#16191f}}
.hover{border-top:1px solid var(--line);padding-top:12px;font-size:14px;min-height:76px}
.hover strong{display:block;font-size:14px}
.go{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:8px;width:100%;padding:10px 12px;margin:0 0 8px;border:1px solid var(--line);border-radius:6px;font-size:14px;box-sizing:border-box;min-height:44px;align-items:center}
.go:hover{border-color:#ff9900}
.go span:last-child{color:var(--link)}
/* drawing */
.t{font-family:Inter,system-ui,sans-serif;fill:#232f3e}
.t1{font-size:12.5px;font-weight:600}.t2{font-size:11px;fill:#545b64}
.el{font-size:11px;fill:#232f3e;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.edge{fill:none;stroke:#232f3e;stroke-width:1.15}
.edge.dash{stroke-dasharray:5 4}
.badge circle{fill:#232f3e}.badge text{fill:#fff;font-size:11px;font-weight:700}
.badge.on circle{fill:#ff9900}
.card rect.box{fill:#fff;stroke:#7d8998;stroke-width:1}
.card{cursor:pointer}
.card:hover rect.box,.card.on rect.box{stroke:#ff9900;stroke-width:2}
.card .zoom{font-size:11px;fill:#0972d3;font-weight:600;opacity:.0;transition:opacity .15s}
.card:hover .zoom,.card:focus .zoom{opacity:1}
.node{cursor:default}.node.link{cursor:pointer}
.node:hover image{filter:drop-shadow(0 0 0 #ff9900) drop-shadow(0 0 3px rgba(255,153,0,.9))}
/* clickable hint: a small zoom badge in the corner of any service that opens its own view */
.hint{pointer-events:none}
.hint-a circle{fill:#fff;stroke:#232f3e;stroke-width:1.1}.hint-a path{stroke:#232f3e;stroke-width:1.3;fill:none;stroke-linecap:round}
.node.link:hover .hint-a circle{stroke:#ff9900;fill:#fff4e5}
.cell{fill:#232f3e}.rowline{stroke:#e9ebed}
@media(max-width:980px){main{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){h1{font-size:19px}.t2{display:none}}
</style>
</head>

const esc = (s) => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const T = (x,y,s,cls="t t2",a="middle") => `<text class="${cls}" x="${x}" y="${y}" text-anchor="${a}">${esc(s)}</text>`;
const badge = (n,x,y) => `<g class="badge" data-n="${n}" transform="translate(${x},${y})"><circle r="10.5"/><text class="t" y="4" text-anchor="middle">${n}</text></g>`;

function frame(v){
  const c = v.cloud || CLOUD, r = v.region;
  let s = `<rect x="${c.x}" y="${c.y}" width="${c.w}" height="${c.h}" fill="none" stroke="#232f3e" stroke-width="1.3"/>
    <rect x="${c.x}" y="${c.y}" width="30" height="24" fill="#232f3e"/><text class="t" x="${c.x+15}" y="${c.y+16}" text-anchor="middle" style="fill:#fff;font-size:10px;font-weight:700">aws</text>
    ${T(c.x+38,c.y+16,"AWS Cloud","t t1","start")}`;
  [r && {...r, label:"Region: eu-west-2 (London)"}, ...(v.regions||[])].filter(Boolean).forEach(r => {
    s += `<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" fill="none" stroke="#00a4a6" stroke-width="1.2" stroke-dasharray="6 4"/>
    <rect x="${r.x}" y="${r.y}" width="22" height="22" fill="#00a4a6"/><path d="M${r.x+7} ${r.y+16} V${r.y+6} h8 l-2 3 l2 3 h-8" fill="none" stroke="#fff" stroke-width="1.4"/>
    <text class="t" x="${r.x+30}" y="${r.y+15}" style="fill:#00777a;font-size:12px;font-weight:600">${r.label}</text>`;
  });
  return s;
}
function group(g){
  const col = g.sfn ? "#e7157b" : "#7d8998";
  let s = `<rect x="${g.x}" y="${g.y}" width="${g.w}" height="${g.h}" fill="${g.sfn?"#fff":"none"}" stroke="${col}" stroke-width="1" ${g.sfn||g.plain?"":'stroke-dasharray="5 4"'}/>`;
  if (g.sfn) s += `<image href="${IC.sfn}" x="${g.x}" y="${g.y}" width="22" height="22"/>`;
  s += T(g.x+(g.sfn?30:10), g.y+16, g.label, "t t1", "start");
  if (g.note) s += T(g.x+g.w/2, g.y+g.h-14, g.note);
  (g.icons||[]).forEach((k,i) => { s += `<image href="${IC[k]}" x="${g.x+28+i*58}" y="${g.y+48}" width="40" height="40"/>`; });
  return s;
}
function card(c){
  return `<g class="card" tabindex="0" role="button" data-go="${c.go}" aria-label="Zoom into ${esc(c.label)}">
    <rect class="box" x="${c.x}" y="${c.y}" width="${c.w}" height="${c.h}" rx="2"/>
    ${badge(c.n, c.x+16, c.y+18)}${T(c.x+32+(c.n.length>1?4:0), c.y+22, c.label, "t t1", "start")}
    <text class="zoom" x="${c.x+c.w-10}" y="${c.y+c.h-10}" text-anchor="end">Zoom in ›</text></g>`;
}
const hint = (x,y,z) => { const h = z/2;
  return `<g class="hint hint-a" transform="translate(${x+h-1},${y-h+1})"><circle r="7.5"/><path d="M-3.2 0 H3.2 M0 -3.2 V3.2"/></g>`; };
function node(n,k){
  const z = n.s || 48, h = z/2;
  let s = `<g class="node${n.go?" link":""}" data-k="${k}" ${n.go?`data-go="${n.go}" tabindex="0" role="button"`:""}>
    <rect x="${n.x-h-4}" y="${n.y-h-4}" width="${z+8}" height="${z+8}" fill="transparent"/>
    <image href="${IC[n.i]}" x="${n.x-h}" y="${n.y-h}" width="${z}" height="${z}"/>${n.go && !n.inherited ? hint(n.x,n.y,z) : ""}`;
  if (n.l) n.l.forEach((line,i) => { s += T(n.x, n.y+h+15+i*14, line, i? "t t2" : "t t1"); });
  if (n.r) s += T(n.x+h+8, n.y+4, n.r[0], "t t2", "start");
  return s + `</g>`;
}
function edge(e){
  const d = e.p.map((p,i) => (i?"L":"M")+p[0]+" "+p[1]).join(" ");
  let s = `<path class="edge${e.dash?" dash":""}" d="${d}" marker-end="url(#ah)"/>`;
  if (e.t) s += `<text class="t el" x="${e.lx}" y="${e.ly}" text-anchor="${e.a||"middle"}">${esc(e.t)}</text>`;
  if (e.s) s += badge(e.s, e.sx, e.sy);
  return s;
}
function matrix(m){
  const cx = [812,890,965,1040,1112];
  let s = "";
  m.cols.forEach((c,i) => {
    s += `<g class="node${c[3]?" link":""}" data-k="col${i}" ${c[3]?`data-go="${c[3]}" tabindex="0" role="button"`:""}><image href="${IC[c[1]]}" x="${cx[i]-17}" y="70" width="34" height="34"/>${c[3] ? hint(cx[i],87,34) : ""}${T(cx[i],120,c[2],"t t2")}</g>`;
  });
  m.rows.forEach((r,j) => {
    const y = 160 + j*70;
    s += `<line class="rowline" x1="${m.x-30}" x2="1150" y1="${y+35}" y2="${y+35}"/>`;
    s += `<path class="edge" d="M430 330 L495 330 L495 ${y} L${m.x-24} ${y}" marker-end="url(#ah)"/>`;
    s += `<g class="node" data-k="row${j}"><image href="${IC.lambda}" x="${m.x-20}" y="${y-20}" width="40" height="40"/>${T(m.x+28,y-3,r[0],"t t1","start")}${T(m.x+28,y+13,r[1],"t t2","start")}</g>`;
    m.cols.forEach((c,i) => { s += r[2].includes(c[0]) ? `<circle class="cell" cx="${cx[i]}" cy="${y}" r="6"/>` : `<circle cx="${cx[i]}" cy="${y}" r="2" fill="#c6ccd2"/>`; });
  });
  return s + badge("3",495,250) + badge("4",772,87);
}
const MATRIX_DESC = {
  row0:"videos: presigned POST for uploads, lists the creator's lessons with progress.",
  row1:"catalogue: published courses in lesson order, with stream and subtitle links.",
  row2:"learn: practice questions and the spaced-repetition reviews due today.",
  row3:"marking: reads the key ideas, asks ClipSensei to mark, saves the result, announces LessonCompleted.",
  row4:"educator: watch the draft, edit objectives, publish or reject with a reason.",
  row5:"insights: per-objective and per-idea stats, plus a short ClipSensei note.",
  row6:"notifications: the bell's latest 20 and unread count; mark as read.",
  col0:"App table: everything except the answers.", col1:"Answer keys: only three functions may read it.",
  col2:"Bedrock / ClipSensei. Click to zoom in.", col3:"The custom event bus. Click to zoom in.", col4:"Uploads bucket (presigned POST only). Click to see the pipeline."};

// ---------- render ----------
const stage = document.getElementById("stage"), panel = document.getElementById("panel"), crumbs = document.getElementById("crumbs");
let current = "overview";

function render(id, fromRect){
  const v = V[id] || V.overview; current = V[id] ? id : "overview";
  let s = frame(v);
  (v.groups||[]).forEach(g => s += group(g));
  (v.cards||[]).forEach(c => s += card(c));
  (v.edges||[]).forEach(e => s += edge(e));
  (v.nodes||[]).forEach((n,k) => {
    // on the overview, a service inside a numbered box zooms into that box too
    const c = (v.cards||[]).find(c => n.x > c.x && n.x < c.x+c.w && n.y > c.y && n.y < c.y+c.h);
    s += node(c && !n.go ? {...n, go:c.go, inherited:true} : n, k);
  });
  if (v.matrix) s += matrix(v.matrix);
  (v.badges||[]).forEach(b => s += badge(...b));
  (v.notes||[]).forEach(n => s += `<foreignObject x="${n.x-170}" y="${n.y-10}" width="340" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="font:12px/1.45 Inter,sans-serif;color:#232f3e;border-left:3px solid #232f3e;padding:4px 10px;background:#f2f3f3">${esc(n.t)}</div></foreignObject>`);
  stage.innerHTML = s;

  crumbs.innerHTML = current === "overview" ? `<b>Overview</b>`
    : `<button type="button" data-go="overview">← Overview</button><span>›</span><b>${esc(v.name)}</b>`;
  const steps = v.steps.length ? `<ol class="steps">${v.steps.map((t,i) => `<li data-n="${current==="api"?i+1:i+1}"><span class="num">${i+1}</span><span>${esc(t)}</span></li>`).join("")}</ol>` : "";
  const links = current === "overview" ? (v.cards.map(c => `<button class="go" type="button" data-go="${c.go}"><span>${c.n} · ${esc(c.label)}</span><span>Zoom in ›</span></button>`).join("")) : "";
  panel.innerHTML = `<h2>${esc(v.title)}</h2><p>${esc(v.lead)}</p>${steps}${links}
    <div class="hover" id="hover"><strong>Hover a service</strong><span style="color:var(--muted)">to see what it does here. ${current==="overview" ? "Click any numbered box to zoom in." : "Marked services open their own view."}</span></div>`;

  if (fromRect && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const cx = fromRect.x + fromRect.w/2, cy = fromRect.y + fromRect.h/2;
    stage.style.transformOrigin = `${cx}px ${cy}px`;
    stage.animate([{transform:"scale(.25)",opacity:0},{transform:"scale(1)",opacity:1}], {duration:420, easing:"cubic-bezier(.2,.7,.2,1)"});
  }
}

function go(id, el){
  let rect = null;
  if (el && el.matches(".card")) { const r = el.querySelector("rect.box"); rect = {x:+r.getAttribute("x"), y:+r.getAttribute("y"), w:+r.getAttribute("width"), h:+r.getAttribute("height")}; }
  if (location.hash.slice(1) !== id) history.pushState(null, "", "#" + id);
  render(id, rect || (id !== "overview" ? {x:500,y:300,w:200,h:100} : null));
  document.querySelector(".board").scrollIntoView({block:"nearest"});
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-go]"); if (t) go(t.dataset.go, t);
});
document.addEventListener("keydown", (e) => {
  const t = e.target.closest && e.target.closest("[data-go]");
  if (t && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); go(t.dataset.go, t); }
  if (e.key === "Escape" && current !== "overview") go("overview");
});
stage.addEventListener("mouseover", (e) => {
  const n = e.target.closest(".node"), c = e.target.closest(".card"), h = document.getElementById("hover");
  if (!h) return;
  if (n) {
    const k = n.dataset.k, v = V[current];
    const item = /^(row|col)/.test(k) ? null : v.nodes[+k];
    const title = item ? (item.l || item.r)[0] : n.querySelector("text").textContent;
    const desc = item ? item.d : MATRIX_DESC[k];
    h.innerHTML = `<strong>${esc(title)}</strong>${esc(desc||"")}${n.dataset.go?` <span style="color:var(--link)">Click to zoom in.</span>`:""}`;
  } else if (c) {
    const card = V.overview.cards.find(x => x.go === c.dataset.go);
    h.innerHTML = `<strong>${esc(card.n+" · "+card.label)}</strong>Click to zoom in.`;
  }
});
panel.addEventListener("mouseover", (e) => {
  const li = e.target.closest("ol.steps li");
  stage.querySelectorAll(".badge.on").forEach(b => b.classList.remove("on"));
  if (li) stage.querySelectorAll(`.badge[data-n="${li.dataset.n}"]`).forEach(b => b.classList.add("on"));
});
window.addEventListener("hashchange", () => render(location.hash.slice(1) || "overview"));
window.addEventListener("popstate", () => render(location.hash.slice(1) || "overview"));
render(location.hash.slice(1) || "overview");
}
</script>
</body>
</html>

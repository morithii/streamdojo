# =============================================================================
# StreamDojo: Netflix-style video learning platform
# with ClipSensei, the AI teaching assistant (active recall + spaced repetition)
#
# Built one exercise at a time:
#   Step 1  - alerts topic
#   Step 4  - Cognito sign-in (creators / educators / learners) + REST API with GET /me
#   Step 5  - DynamoDB tables, private upload bucket, POST /videos (presigned upload) + GET /videos
#   Step 6  - upload event -> EventBridge -> Step Functions (starts exactly once)
#   Step 7  - MediaConvert: adaptive HLS (360p/720p/1080p), audio for Transcribe, thumbnail
#   Steps 8-9 - Transcribe (English subtitles + clean transcript) -> Translate (fr, es, it, el)
#   Steps 10-11 - ClipSensei (Bedrock) drafts learning objectives -> educator review + publish API
#   Steps 12-13 - learner practice (active recall), ClipSensei marking with evidence checks, spaced repetition
#   Step 14 - educator insights: what's sticking, what isn't, who needs help (+ ClipSensei summary)
# =============================================================================
AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31   # turns SAM shorthand into full CloudFormation
Description: StreamDojo - video learning platform with the ClipSensei AI teaching assistant

# -----------------------------------------------------------------------------
# Parameters: values that change per environment, passed in at deploy time
# -----------------------------------------------------------------------------
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Deployment environment, used in resource names
  AlertEmail:
    Type: String
    Default: ""
    Description: Email address for alarm and budget alerts (leave empty to skip the subscription)
  FrontendUrl:
    Type: String
    Default: http://localhost:8080
    Description: Where the web app runs; Cognito only redirects back to this address after sign-in
  GenerationModelId:
    Type: String
    Default: eu.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: Bedrock EU inference profile ClipSensei uses to draft learning objectives
  MarkingModelId:
    Type: String
    Default: eu.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: Bedrock EU inference profile ClipSensei uses to mark learners' answers (fast, low cost)

# -----------------------------------------------------------------------------
# Conditions: only subscribe an email when one was actually provided
# -----------------------------------------------------------------------------
Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]
  IsDev: !Equals [!Ref Environment, dev]

# -----------------------------------------------------------------------------
# Globals: defaults applied to every Lambda function and API we add later,
# so each function definition stays short and consistent
# -----------------------------------------------------------------------------
Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]        # Graviton: about 20% cheaper than x86 for the same work
    MemorySize: 256
    Timeout: 30
    Tracing: Active               # AWS X-Ray traces for every function
    LoggingConfig:
      LogFormat: JSON             # structured logs, easy to search in CloudWatch
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        POWERTOOLS_SERVICE_NAME: streamdojo
  Api:
    TracingEnabled: true          # X-Ray on the REST API (added in a later step)

# -----------------------------------------------------------------------------
# Resources
# -----------------------------------------------------------------------------
Resources:
  # Central topic for operational alerts (alarms, budget, failed workflows)
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub streamdojo-${Environment}-alerts
      KmsMasterKeyId: alias/aws/sns   # encrypt messages at rest with the AWS-managed key

  # Email subscription, created only when AlertEmail is set.
  # AWS sends a confirmation email that you must click before alerts arrive.
  AlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # ===========================================================================
  # Step 4: sign-in with Amazon Cognito
  # ===========================================================================

  # The user directory: who can sign in, and how
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub streamdojo-${Environment}-users
      UserPoolTier: LITE                    # cheapest tier; enough for the classic hosted sign-in page
      UsernameAttributes: [email]           # people sign in with their email address
      AutoVerifiedAttributes: [email]       # Cognito emails a code to prove the address is real
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false     # self sign-up is allowed (new users become learners)
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 3
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Schema:
        - Name: name                        # display name shown to educators (never the email)
          AttributeDataType: String
          Mutable: true
          Required: false
      DeletionProtection: INACTIVE          # dev: lets us tear the stack down; set ACTIVE in prod

  # The web app's "app client". A browser can't keep a secret, so there is none;
  # it uses the authorization code flow with PKCE instead (the secure option for SPAs).
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub streamdojo-${Environment}-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [!Sub "${FrontendUrl}/"]
      LogoutURLs: [!Sub "${FrontendUrl}/"]
      # USER_PASSWORD_AUTH lets us get a token from the CLI for testing - dev only
      ExplicitAuthFlows: !If
        - IsDev
        - [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH, ALLOW_USER_PASSWORD_AUTH]
        - [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED   # don't reveal whether an email has an account
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  # Hosted sign-in page at https://streamdojo-dev-<account>.auth.eu-west-2.amazoncognito.com
  # (the account ID makes the prefix globally unique)
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub streamdojo-${Environment}-${AWS::AccountId}
      UserPoolId: !Ref UserPool
      ManagedLoginVersion: 1                # classic hosted UI: no branding resource needed

  # The three roles. Groups appear in every token as "cognito:groups",
  # which is how each API function decides what the caller may do.
  CreatorsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: creators
      Description: Upload lesson videos
      Precedence: 2
  EducatorsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: educators
      Description: Review and publish learning objectives; see recall insights
      Precedence: 1
  LearnersGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: learners
      Description: Watch lessons, practise recall, do reviews and gradings
      Precedence: 3

  # Runs once when someone confirms their sign-up and puts them in "learners".
  # Creators and educators are promoted by an admin, never by themselves.
  PostConfirmationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub streamdojo-${Environment}-post-confirmation
      CodeUri: src/post_confirmation/
      Handler: app.handler
      Timeout: 5
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: cognito-idp:AdminAddUserToGroup
              # userpool/* rather than the pool's own ARN: the pool references this
              # function as its trigger, so referencing the pool here would be circular
              Resource: !Sub arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*
      Events:
        SignUpConfirmed:
          Type: Cognito                     # SAM wires the trigger and the invoke permission
          Properties:
            UserPool: !Ref UserPool
            Trigger: PostConfirmation

  # ===========================================================================
  # Step 4: the REST API. Every route requires a valid Cognito token by default.
  # ===========================================================================
  StreamDojoApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub streamdojo-${Environment}-api
      StageName: !Ref Environment
      Cors:
        AllowOrigin: !Sub "'${FrontendUrl}'"
        AllowHeaders: "'Authorization,Content-Type'"
        AllowMethods: "'GET,POST,PUT,OPTIONS'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false   # browsers send OPTIONS without a token
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn   # API Gateway checks the ID token's signature and expiry

  # GET /me - who am I, and which groups am I in? The frontend uses this to pick
  # which view to show; it's also the simplest proof that sign-in works end to end.
  MeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub streamdojo-${Environment}-me
      CodeUri: src/me/
      Handler: app.handler
      Timeout: 5
      Environment:
        Variables:
          ALLOWED_ORIGIN: !Ref FrontendUrl
      Events:
        GetMe:
          Type: Api
          Properties:
            RestApiId: !Ref StreamDojoApi
            Path: /me
            Method: get

  # ===========================================================================
  # Step 5: data (see docs/data-model.md) and video uploads
  # ===========================================================================

  # Main single-table store: lessons, objectives, attempts, schedules, belts, topics
  AppTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub streamdojo-${Environment}
      BillingMode: PAY_PER_REQUEST          # on-demand: pay per request, nothing when idle
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true    # restore to any second in the last 35 days
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
        - { AttributeName: GSI2PK, AttributeType: S }
        - { AttributeName: GSI2SK, AttributeType: S }
        - { AttributeName: GSI3PK, AttributeType: S }
        - { AttributeName: GSI3SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1                   # DRAFTS queue, then CATALOGUE (sparse)
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: GSI2                   # creator's uploads; flagged answers (overloaded)
          KeySchema:
            - { AttributeName: GSI2PK, KeyType: HASH }
            - { AttributeName: GSI2SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: GSI3                   # a learner's due reviews (sparse)
          KeySchema:
            - { AttributeName: GSI3PK, KeyType: HASH }
            - { AttributeName: GSI3SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  # Answer keys live in their own table so IAM - not just code - stops
  # learner-facing functions from ever reading them
  AnswerKeysTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub streamdojo-${Environment}-answer-keys
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }

  # Private bucket where creators' original videos land
  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub streamdojo-${Environment}-uploads-${AWS::AccountId}   # bucket names are global
      PublicAccessBlockConfiguration:       # nothing in here can ever be made public
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced   # ACLs disabled; the bucket owner owns every object
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256          # SSE-S3: encrypted at rest, no KMS cost
      VersioningConfiguration:
        Status: Enabled                     # an overwritten or deleted original can be recovered
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true          # "Object Created" events go to EventBridge (used in Step 6)
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref FrontendUrl]   # only our web app may upload from a browser
            AllowedMethods: [POST]
            AllowedHeaders: ["*"]
            MaxAge: 3000

  # Refuse any request that doesn't use HTTPS
  UploadBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UploadBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt UploadBucket.Arn
              - !Sub ${UploadBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # POST /videos (start an upload) and GET /videos (my uploads) - creators only
  VideosFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub streamdojo-${Environment}-videos
      CodeUri: src/videos/
      Handler: app.handler
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: !Ref AppTable
          UPLOAD_BUCKET: !Ref UploadBucket
          ALLOWED_ORIGIN: !Ref FrontendUrl
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: CreateVideoItems
              Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt AppTable.Arn
            - Sid: ListMyVideos
              Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub ${AppTable.Arn}/index/GSI2
            # A presigned upload acts with the permissions of whoever signed it,
            # so this function may only put objects under raw/ - nothing else
            - Sid: SignUploadsToRawOnly
              Effect: Allow
              Action: s3:PutObject
              Resource: !Sub ${UploadBucket.Arn}/raw/*
      Events:
        CreateVideo:
          Type: Api
          Properties:
            RestApiId: !Ref StreamDojoApi
            Path: /videos
            Method: post
        ListVideos:
          Type: Api
          Properties:
            RestApiId: !Ref StreamDojoApi
            Path: /videos
            Method: get

  # ===========================================================================
  # Steps 6-7: processing pipeline (upload -> EventBridge -> Step Functions -> MediaConvert)
  # ===========================================================================

  # Private bucket for everything MediaConvert produces (HLS streams, audio, thumbnails)
  ProcessedBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub streamdojo-${Environment}-media-${AWS::AccountId}
      PublicAccessBlockConfiguration:       # served later through CloudFront only, never publicly
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  ProcessedBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ProcessedBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt ProcessedBucket.Arn
              - !Sub ${ProcessedBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # The role MediaConvert itself uses: read originals from raw/, write results to processed/
  MediaConvertRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: mediaconvert.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: read-raw-write-processed
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${UploadBucket.Arn}/raw/*
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${ProcessedBucket.Arn}/processed/*

  # Execution history logs (/aws/vendedlogs/ prefix avoids CloudWatch resource-policy size limits)
  ProcessVideoLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/vendedlogs/states/streamdojo-${Environment}-process-video
      RetentionInDays: 14

  # The workflow. Triggered by EventBridge whenever a file lands under raw/.
  ProcessVideoStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub streamdojo-${Environment}-process-video
      Type: STANDARD                        # long-running, exactly-once, full visual history
      DefinitionUri: statemachine/process_video.asl.json
      DefinitionSubstitutions:              # fills ${...} placeholders in the JSON definition
        AppTableName: !Ref AppTable
        ProcessedBucketName: !Ref ProcessedBucket
        MediaConvertRoleArn: !GetAtt MediaConvertRole.Arn
        PrepareTranscriptFunctionArn: !GetAtt PrepareTranscriptFunction.Arn
        TranslateSubtitlesFunctionArn: !GetAtt TranslateSubtitlesFunction.Arn
        GenerateObjectivesFunctionArn: !GetAtt GenerateObjectivesFunction.Arn
      Tracing:
        Enabled: true
      Logging:
        Level: ERROR
        IncludeExecutionData: false         # don't copy event payloads into logs
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt ProcessVideoLogGroup.Arn
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: UpdateLessonStatus
              Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt AppTable.Arn
            - Sid: RunMediaConvertJobs
              Effect: Allow
              Action:
                - mediaconvert:CreateJob
                - mediaconvert:GetJob
                - mediaconvert:CancelJob
              Resource: "*"                 # jobs get random IDs, so they can't be named in advance
            - Sid: PassRoleToMediaConvertOnly
              Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt MediaConvertRole.Arn
              Condition:
                StringEquals:
                  iam:PassedToService: mediaconvert.amazonaws.com
            - Sid: SyncIntegrationRule      # .sync uses a managed EventBridge rule to learn when the job ends
              Effect: Allow
              Action:
                - events:PutTargets
                - events:PutRule
                - events:DescribeRule
              Resource: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/StepFunctionsGetEventsForMediaConvertJobRule
            - Sid: WriteExecutionLogs       # these log-delivery actions don't support resource-level permissions
              Effect: Allow
              Action:
                - logs:CreateLogDelivery
                - logs:GetLogDelivery
                - logs:UpdateLogDelivery
                - logs:DeleteLogDelivery
                - logs:ListLogDeliveries
                - logs:PutResourcePolicy
                - logs:DescribeResourcePolicies
                - logs:DescribeLogGroups
              Resource: "*"
            - Sid: XRayTracing
              Effect: Allow
              Action:
                - xray:PutTraceSegments
                - xray:PutTelemetryRecords
                - xray:GetSamplingRules
                - xray:GetSamplingTargets
              Resource: "*"
            - Sid: RunTranscribeJobs        # Transcribe job ARNs aren't known in advance
              Effect: Allow
              Action:
                - transcribe:StartTranscriptionJob
                - transcribe:GetTranscriptionJob
              Resource: "*"
            - Sid: TranscribeReadsAudioWritesTranscript   # Transcribe acts with the caller's S3 permissions
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub ${ProcessedBucket.Arn}/processed/*
            - Sid: InvokeCaptionFunctions
              Effect: Allow
              Action: lambda:InvokeFunction
              Resource:
                - !GetAtt PrepareTranscriptFunction.Arn
                - !GetAtt TranslateSubtitlesFunction.Arn
                - !GetAtt GenerateObjectivesFunction.Arn
      Events:
        VideoUploaded:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source: [aws.s3]
              detail-type: [Object Created]
              detail:
                bucket:
                  name: [!Ref UploadBucket]
                object:
                  key: [{ prefix: raw/ }]
            RetryPolicy:
              MaximumRetryAttempts: 3
              MaximumEventAgeInSeconds: 3600
            DeadLetterConfig:
              Type: SQS                     # SAM creates the queue; events that can't start the workflow land here

  # ===========================================================================
  # Steps 8-9: captions - Transcribe (English) then Translate (fr, es, it, el)
  # ===========================================================================

  # Cleans Transcribe's output for ClipSensei and publishes the English subtitles
  PrepareTranscriptFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub streamdojo-${Environment}-prepare-transcript
      CodeUri: src/prepare_transcript/
      Handler: app.handler
      Timeout: 60
      Environment:
        Variables:
          TABLE_NAME: !Ref AppTable
          MEDIA_BUCKET: !Ref ProcessedBucket
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: ReadAndWriteTranscripts
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub ${ProcessedBucket.Arn}/processed/*
            - Sid: UpdateLessonCaptions
              Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt AppTable.Arn

  # Translates the English subtitles into one language (called 4x in parallel)
  TranslateSubtitlesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub streamdojo-${Environment}-translate-subtitles
      CodeUri: src/translate_subtitles/
      Handler: app.handler
      Timeout: 300                          # long lessons have many cues
      Environment:
        Variables:
          TABLE_NAME: !Ref AppTable
          MEDIA_BUCKET: !Ref ProcessedBucket
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: ReadEnglishWriteTranslations
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub ${ProcessedBucket.Arn}/processed/*
            - Sid: Translate                # TranslateText doesn't support resource-level permissions
              Effect: Allow
              Action: translate:TranslateText
              Resource: "*"
            - Sid: AddSubtitleLanguage
              Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt AppTable.Arn

  # ===========================================================================
  # Steps 10-11: ClipSensei (Bedrock) drafts learning objectives; educators review and publish
  # ===========================================================================

  # ClipSensei: reads the transcript, drafts objectives + answer keys with Amazon Bedrock
  GenerateObjectivesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub streamdojo-${Environment}-generate-objectives
      CodeUri: src/generate_objectives/
      Handler: app.handler
      Timeout: 120                          # an LLM call on a long transcript can take a while
      MemorySize: 512
      Environment:
        Variables:
          TABLE_NAME: !Ref AppTable
          KEYS_TABLE_NAME: !Ref AnswerKeysTable
          MEDIA_BUCKET: !Ref ProcessedBucket
          MODEL_ID: !Ref GenerationModelId
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: ReadTranscript
              Effect: Allow
              Action: s3:GetObject
              Resource: !Sub ${ProcessedBucket.Arn}/processed/*
            - Sid: InvokeClipSenseiModel    # only this EU inference profile and the Anthropic models behind it
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${GenerationModelId}
                - arn:aws:bedrock:*::foundation-model/anthropic.*
            - Sid: WriteDraftObjectives
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt AppTable.Arn
            - Sid: WriteAnswerKeys
              Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt AnswerKeysTable.Arn

  # Educator API: review queue, view/edit objectives with answer keys, publish
  EducatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub streamdojo-${Environment}-educator
      CodeUri: src/educator/
      Handler: app.handler
      Timeout: 15
      Environment:
        Variables:
          TABLE_NAME: !Ref AppTable
          KEYS_TABLE_NAME: !Ref AnswerKeysTable
          ALLOWED_ORIGIN: !Ref FrontendUrl
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: ReviewAndPublishLessons
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt AppTable.Arn
                - !Sub ${AppTable.Arn}/index/GSI1
            - Sid: ReadAndEditAnswerKeys
              Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:UpdateItem
              Resource: !GetAtt AnswerKeysTable.Arn
      Events:
        ListDrafts:
          Type: Api
          Properties:
            RestApiId: !Ref StreamDojoApi
            Path: /lessons
            Method: get
        GetObjectives:
          Type: Api
          Properties:
            RestApiId: !Ref StreamDojoApi
            Path: /lessons/{videoId}/objectives
            Method: get
        UpdateObjective:
          Type: Api
          Properties:
            RestApiId: !Ref StreamDojoApi
            Path: /lessons/{videoId}/objectives/{objectiveId}
            Method: put
        PublishLesson:
          Type: Api
          Properties:
            RestApiId: !Ref StreamDojoApi
            Path: /lessons/{videoId}/publish
            Method: post

  # ===========================================================================
  # Steps 12-13: learner practice (active recall), ClipSensei marking, spaced repetition
  # ===========================================================================

  # Read-only learner API: practice prompts and reviews due. Deliberately NO answer-keys access.
  LearnFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub streamdojo-${Environment}-learn
      CodeUri: src/learn/
      Handler: app.handler
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: !Ref AppTable
          ALLOWED_ORIGIN: !Ref FrontendUrl
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: ReadPublishedLessonsAndDueReviews
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
              Resource:
                - !GetAtt AppTable.Arn
                - !Sub ${AppTable.Arn}/index/GSI3
      Events:
        Practice:
          Type: Api
          Properties:
            RestApiId: !Ref StreamDojoApi
            Path: /learn/lessons/{videoId}/practice
            Method: get
        ReviewsDue:
          Type: Api
          Properties:
            RestApiId: !Ref StreamDojoApi
            Path: /learn/reviews/due
            Method: get

  # ClipSensei marking: the only learner-facing function that may read answer keys
  MarkingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub streamdojo-${Environment}-marking
      CodeUri: src/marking/
      Handler: app.handler
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref AppTable
          KEYS_TABLE_NAME: !Ref AnswerKeysTable
          MODEL_ID: !Ref MarkingModelId
          ALLOWED_ORIGIN: !Ref FrontendUrl
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: SaveAttemptsSchedulesAndStats
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt AppTable.Arn
            - Sid: ReadAnswerKeysOnly       # read, never write
              Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt AnswerKeysTable.Arn
            - Sid: InvokeMarkingModel
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${MarkingModelId}
                - arn:aws:bedrock:*::foundation-model/anthropic.*
      Events:
        SubmitAttempt:
          Type: Api
          Properties:
            RestApiId: !Ref StreamDojoApi
            Path: /learn/attempts
            Method: post
        Hint:
          Type: Api
          Properties:
            RestApiId: !Ref StreamDojoApi
            Path: /learn/hint/{videoId}/{objectiveId}
            Method: get

  # ===========================================================================
  # Step 14: educator insights - read-only numbers + a ClipSensei summary
  # ===========================================================================
  InsightsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub streamdojo-${Environment}-insights
      CodeUri: src/insights/
      Handler: app.handler
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref AppTable
          KEYS_TABLE_NAME: !Ref AnswerKeysTable
          MODEL_ID: !Ref GenerationModelId
          ALLOWED_ORIGIN: !Ref FrontendUrl
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: ReadLessonStatsAndSchedules     # read only: Query on the main table
              Effect: Allow
              Action: dynamodb:Query
              Resource: !GetAtt AppTable.Arn
            - Sid: ReadEssentialPointWording       # read only: Query on the answer keys
              Effect: Allow
              Action: dynamodb:Query
              Resource: !GetAtt AnswerKeysTable.Arn
            - Sid: InvokeSummaryModel
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${GenerationModelId}
                - arn:aws:bedrock:*::foundation-model/anthropic.*
      Events:
        LessonInsights:
          Type: Api
          Properties:
            RestApiId: !Ref StreamDojoApi
            Path: /insights/lessons/{videoId}
            Method: get

# -----------------------------------------------------------------------------
# Outputs: values other steps and the README will need
# -----------------------------------------------------------------------------
Outputs:
  AlertsTopicArn:
    Description: SNS topic that receives StreamDojo alerts
    Value: !Ref AlertsTopic
  ApiUrl:
    Description: Base URL of the StreamDojo REST API
    Value: !Sub https://${StreamDojoApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
  UserPoolId:
    Description: Cognito user pool ID
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito app client ID for the web app
    Value: !Ref UserPoolClient
  HostedLoginUrl:
    Description: Cognito hosted sign-in page
    Value: !Sub https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com/login?client_id=${UserPoolClient}&response_type=code&scope=openid+email+profile&redirect_uri=${FrontendUrl}/
  AppTableName:
    Description: Main DynamoDB table
    Value: !Ref AppTable
  AnswerKeysTableName:
    Description: Answer-keys DynamoDB table
    Value: !Ref AnswerKeysTable
  UploadBucketName:
    Description: Private bucket for original video uploads
    Value: !Ref UploadBucket

  ProcessedBucketName:
    Description: Private bucket for HLS streams, audio and thumbnails
    Value: !Ref ProcessedBucket
  ProcessVideoStateMachineArn:
    Description: The video processing workflow
    Value: !Ref ProcessVideoStateMachine

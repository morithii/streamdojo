# =============================================================================
# StreamDojo: Netflix-style video learning platform
# with ClipSensei, the AI teaching assistant (active recall + spaced repetition)
#
# Built one exercise at a time:
#   Step 1  - alerts topic
#   Step 4  - Cognito sign-in (creators / educators / learners) + REST API with GET /me
#   Step 5  - DynamoDB tables, private upload bucket, POST /videos (presigned upload) + GET /videos
#   Step 6  - upload event -> EventBridge -> Step Functions (starts exactly once)
#   Step 7  - MediaConvert: adaptive HLS (360p/720p/1080p), audio for Transcribe, thumbnail
#   Steps 8-9 - Transcribe (English subtitles + clean transcript) -> Translate (fr, es, it, el)
#   Steps 10-11 - ClipSensei (Bedrock) drafts learning objectives -> educator review + publish API
#   Steps 12-13 - learner practice (active recall), ClipSensei marking with evidence checks, spaced repetition
#   Step 14 - educator insights: what's sticking, what isn't, who needs help (+ ClipSensei summary)
#   Step 15 - website hosting: one CloudFront address for the site (/), the API (/api) and media (/media), catalogue API
# =============================================================================
AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31   # turns SAM shorthand into full CloudFormation
Description: StreamDojo - video learning platform with the ClipSensei AI teaching assistant

# -----------------------------------------------------------------------------
# Parameters: values that change per environment, passed in at deploy time
# -----------------------------------------------------------------------------
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Deployment environment, used in resource names
  MonthlyBudgetUsd:
    Type: Number
    Default: 25
    Description: Monthly AWS budget in USD - emails at 80% actual and 100% forecast (Step 19)
  AlertEmail:
    Type: String
    Default: ""
    Description: Email address for alarm and budget alerts (leave empty to skip the subscription)
  FrontendUrl:
    Type: String
    Default: http://localhost:8080
    Description: Where the web app runs; Cognito only redirects back to this address after sign-in
  GenerationModelId:
    Type: String
    Default: eu.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: Bedrock EU inference profile ClipSensei uses to draft learning objectives
  MarkingModelId:
    Type: String
    Default: eu.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: Bedrock EU inference profile ClipSensei uses to mark learners' answers (fast, low cost)

# -----------------------------------------------------------------------------
# Conditions: only subscribe an email when one was actually provided
# -----------------------------------------------------------------------------
Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]
  IsDev: !Equals [!Ref Environment, dev]

# -----------------------------------------------------------------------------
# Globals: defaults applied to every Lambda function and API we add later,
# so each function definition stays short and consistent
# -----------------------------------------------------------------------------
Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]        # Graviton: about 20% cheaper than x86 for the same work
    MemorySize: 256
    Timeout: 30
    Tracing: Active               # AWS X-Ray traces for every function
    LoggingConfig:
      LogFormat: JSON             # structured logs, easy to search in CloudWatch
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        POWERTOOLS_SERVICE_NAME: streamdojo
  Api:
    TracingEnabled: true          # X-Ray on the REST API (added in a later step)

# -----------------------------------------------------------------------------
# Resources
# -----------------------------------------------------------------------------
Resources:
  # Central topic for operational alerts (alarms, budget, failed workflows)
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub streamdojo-${Environment}-alerts
      KmsMasterKeyId: !Ref AlertsKey   # customer-managed key (Step 19): CloudWatch alarms may use it, the AWS-managed one can't

  # Email subscription, created only when AlertEmail is set.
  # AWS sends a confirmation email that you must click before alerts arrive.
  AlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # ===========================================================================
  # Step 4: sign-in with Amazon Cognito
  # ===========================================================================

  # The user directory: who can sign in, and how
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub streamdojo-${Environment}-users
      UserPoolTier: LITE                    # cheapest tier; enough for the classic hosted sign-in page
      UsernameAttributes: [email]           # people sign in with their email address
      AutoVerifiedAttributes: [email]       # Cognito emails a code to prove the address is real
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false     # self sign-up is allowed (new users become learners)
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 3
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Schema:
        - Name: name                        # display name shown to educators (never the email)
          AttributeDataType: String
          Mutable: true
          Required: false
      DeletionProtection: INACTIVE          # dev: lets us tear the stack down; set ACTIVE in prod

  # The web app's "app client". A browser can't keep a secret, so there is none;
  # it uses the authorization code flow with PKCE instead (the secure option for SPAs).
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub streamdojo-${Environment}-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]
      # Sign-in may only return to local development or our CloudFront site (Step 15)
      CallbackURLs: [!Sub "${FrontendUrl}/", !Sub "https://${SiteDistribution.DomainName}/"]
      LogoutURLs: [!Sub "${FrontendUrl}/", !Sub "https://${SiteDistribution.DomainName}/"]
      # USER_PASSWORD_AUTH lets us get a token from the CLI for testing - dev only
      ExplicitAuthFlows: !If
        - IsDev
        - [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH, ALLOW_USER_PASSWORD_AUTH]
        - [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED   # don't reveal whether an email has an account
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  # Hosted sign-in page at https://streamdojo-dev-<account>.auth.eu-west-2.amazoncognito.com
  # (the account ID makes the prefix globally unique)
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub streamdojo-${Environment}-${AWS::AccountId}
      UserPoolId: !Ref UserPool
      ManagedLoginVersion: 1                # classic hosted UI: no branding resource needed

  # The three roles. Groups appear in every token as "cognito:groups",
  # which is how each API function decides what the caller may do.
  CreatorsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: creators
      Description: Upload lesson videos
      Precedence: 2
  EducatorsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: educators
      Description: Review and publish learning objectives; see recall insights
      Precedence: 1
  LearnersGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: learners
      Description: Watch lessons, practise recall, do reviews and gradings
      Precedence: 3

  # Runs once when someone confirms their sign-up and puts them in "learners".
  # Creators and educators are promoted by an admin, never by themselves.
  PostConfirmationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub streamdojo-${Environment}-post-confirmation
      CodeUri: src/post_confirmation/
      Handler: app.handler
      Timeout: 5
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: cognito-idp:AdminAddUserToGroup
              # userpool/* rather than the pool's own ARN: the pool references this
              # function as its trigger, so referencing the pool here would be circular
              Resource: !Sub arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*
      Events:
        SignUpConfirmed:
          Type: Cognito                     # SAM wires the trigger and the invoke permission
          Properties:
            UserPool: !Ref UserPool
            Trigger: PostConfirmation

  # ===========================================================================
  # Step 4: the REST API. Every route requires a valid Cognito token by default.
  # ===========================================================================
  StreamDojoApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub streamdojo-${Environment}-api
      StageName: !Ref Environment
      Cors:
        AllowOrigin: !Sub "'${FrontendUrl}'"
        AllowHeaders: "'Authorization,Content-Type'"
        AllowMethods: "'GET,POST,PUT,OPTIONS'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false   # browsers send OPTIONS without a token
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn   # API Gateway checks the ID token's signature and expiry

  # GET /me - who am I, and which groups am I in? The frontend uses this to pick
  # which view to show; it's also the simplest proof that sign-in works end to end.
  MeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub streamdojo-${Environment}-me
      CodeUri: src/me/
      Handler: app.handler
      Timeout: 5
      Environment:
        Variables:
          ALLOWED_ORIGIN: !Ref FrontendUrl
          TABLE_NAME: !Ref AppTable
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: ReadOwnDojoPoints        # one GetItem on the caller's PROFILE item
              Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt AppTable.Arn
      Events:
        GetMe:
          Type: Api
          Properties:
            RestApiId: !Ref StreamDojoApi
            Path: /me
            Method: get

  # ===========================================================================
  # Step 5: data (see docs/data-model.md) and video uploads
  # ===========================================================================

  # Main single-table store: lessons, objectives, attempts, schedules, belts, topics
  AppTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub streamdojo-${Environment}
      TimeToLiveSpecification:         # Step 20: bell notifications delete themselves after 30 days
        AttributeName: expiresAt
        Enabled: true
      BillingMode: PAY_PER_REQUEST          # on-demand: pay per request, nothing when idle
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true    # restore to any second in the last 35 days
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
        - { AttributeName: GSI2PK, AttributeType: S }
        - { AttributeName: GSI2SK, AttributeType: S }
        - { AttributeName: GSI3PK, AttributeType: S }
        - { AttributeName: GSI3SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1                   # DRAFTS queue, then CATALOGUE (sparse)
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: GSI2                   # creator's uploads; flagged answers (overloaded)
          KeySchema:
            - { AttributeName: GSI2PK, KeyType: HASH }
            - { AttributeName: GSI2SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: GSI3                   # a learner's due reviews (sparse)
          KeySchema:
            - { AttributeName: GSI3PK, KeyType: HASH }
            - { AttributeName: GSI3SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  # Answer keys live in their own table so IAM - not just code - stops
  # learner-facing functions from ever reading them
  AnswerKeysTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub streamdojo-${Environment}-answer-keys
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }

  # Private bucket where creators' original videos land
  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub streamdojo-${Environment}-uploads-${AWS::AccountId}   # bucket names are global
      PublicAccessBlockConfiguration:       # nothing in here can ever be made public
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced   # ACLs disabled; the bucket owner owns every object
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256          # SSE-S3: encrypted at rest, no KMS cost
      VersioningConfiguration:
        Status: Enabled                     # an overwritten or deleted original can be recovered
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true          # "Object Created" events go to EventBridge (used in Step 6)
      CorsConfiguration:
        CorsRules:
          # Only our web app may upload from a browser: local development, and the CloudFront site (Step 17)
          - AllowedOrigins: [!Ref FrontendUrl, !Sub "https://${SiteDistribution.DomainName}"]
            AllowedMethods: [POST]
            AllowedHeaders: ["*"]
            MaxAge: 3000

  # Refuse any request that doesn't use HTTPS
  UploadBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UploadBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt UploadBucket.Arn
              - !Sub ${UploadBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # POST /videos (start an upload) and GET /videos (my uploads) - creators only
  VideosFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub streamdojo-${Environment}-videos
      CodeUri: src/videos/
      Handler: app.handler
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: !Ref AppTable
          # The bucket's NAME as text, not !Ref: the upload bucket's CORS rule now points at CloudFront,
          # CloudFront points at the API, the API at this function - a !Ref here would close that loop
          UPLOAD_BUCKET: !Sub streamdojo-${Environment}-uploads-${AWS::AccountId}
          ALLOWED_ORIGIN: !Ref FrontendUrl
          EVENT_BUS_NAME: !Ref EventBus
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: CreateVideoItems
              Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt AppTable.Arn
            - Sid: HideDeletedVideo       # read the lesson, mark it DELETED, take it out of every list
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt AppTable.Arn
            - Sid: AnnounceDeletion       # LessonDeleted starts the cleanup function
              Effect: Allow
              Action: events:PutEvents
              Resource: !GetAtt EventBus.Arn
            - Sid: ListMyVideos
              Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub ${AppTable.Arn}/index/GSI2
            # A presigned upload acts with the permissions of whoever signed it,
            # so this function may only put objects under raw/ - nothing else
            - Sid: SignUploadsToRawOnly
              Effect: Allow
              Action: s3:PutObject
              Resource: !Sub arn:aws:s3:::streamdojo-${Environment}-uploads-${AWS::AccountId}/raw/*   # same reason
      Events:
        CreateVideo:
          Type: Api
          Properties:
            RestApiId: !Ref StreamDojoApi
            Path: /videos
            Method: post
        ListVideos:
          Type: Api
          Properties:
            RestApiId: !Ref StreamDojoApi
            Path: /videos
            Method: get
        DeleteVideo:                      # the creator (own videos) or any educator
          Type: Api
          Properties:
            RestApiId: !Ref StreamDojoApi
            Path: /videos/{videoId}
            Method: delete

  # ===========================================================================
  # Steps 6-7: processing pipeline (upload -> EventBridge -> Step Functions -> MediaConvert)
  # ===========================================================================

  # Private bucket for everything MediaConvert produces (HLS streams, audio, thumbnails)
  ProcessedBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub streamdojo-${Environment}-media-${AWS::AccountId}
      PublicAccessBlockConfiguration:       # served later through CloudFront only, never publicly
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  ProcessedBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ProcessedBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt ProcessedBucket.Arn
              - !Sub ${ProcessedBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"
          # Step 15: CloudFront (and only our distribution) may read what the player needs -
          # HLS video, thumbnails and subtitle files. Audio, raw transcripts and clean.json stay private.
          - Sid: AllowCloudFrontPlayerFilesOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource:
              - !Sub ${ProcessedBucket.Arn}/processed/*/hls/*
              - !Sub ${ProcessedBucket.Arn}/processed/*/thumb*
              - !Sub ${ProcessedBucket.Arn}/processed/*/transcript/subtitles.*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}

  # The role MediaConvert itself uses: read originals from raw/, write results to processed/
  MediaConvertRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: mediaconvert.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: read-raw-write-processed
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${UploadBucket.Arn}/raw/*
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${ProcessedBucket.Arn}/processed/*

  # Execution history logs (/aws/vendedlogs/ prefix avoids CloudWatch resource-policy size limits)
  ProcessVideoLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/vendedlogs/states/streamdojo-${Environment}-process-video
      RetentionInDays: 14

  # The workflow. Triggered by EventBridge whenever a file lands under raw/.
  ProcessVideoStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub streamdojo-${Environment}-process-video
      Type: STANDARD                        # long-running, exactly-once, full visual history
      DefinitionUri: statemachine/process_video.asl.json
      DefinitionSubstitutions:              # fills ${...} placeholders in the JSON definition
        AppTableName: !Ref AppTable
        ProcessedBucketName: !Ref ProcessedBucket
        MediaConvertRoleArn: !GetAtt MediaConvertRole.Arn
        PrepareTranscriptFunctionArn: !GetAtt PrepareTranscriptFunction.Arn
        TranslateSubtitlesFunctionArn: !GetAtt TranslateSubtitlesFunction.Arn
        GenerateObjectivesFunctionArn: !GetAtt GenerateObjectivesFunction.Arn
        ModerationFunctionArn: !GetAtt ModerationFunction.Arn
      Tracing:
        Enabled: true
      Logging:
        Level: ERROR
        IncludeExecutionData: false         # don't copy event payloads into logs
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt ProcessVideoLogGroup.Arn
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: UpdateLessonStatus
              Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt AppTable.Arn
            - Sid: RunMediaConvertJobs
              Effect: Allow
              Action:
                - mediaconvert:CreateJob
                - mediaconvert:GetJob
                - mediaconvert:CancelJob
              Resource: "*"                 # jobs get random IDs, so they can't be named in advance
            - Sid: PassRoleToMediaConvertOnly
              Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt MediaConvertRole.Arn
              Condition:
                StringEquals:
                  iam:PassedToService: mediaconvert.amazonaws.com
            - Sid: SyncIntegrationRule      # .sync uses a managed EventBridge rule to learn when the job ends
              Effect: Allow
              Action:
                - events:PutTargets
                - events:PutRule
                - events:DescribeRule
              Resource: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/StepFunctionsGetEventsForMediaConvertJobRule
            - Sid: WriteExecutionLogs       # these log-delivery actions don't support resource-level permissions
              Effect: Allow
              Action:
                - logs:CreateLogDelivery
                - logs:GetLogDelivery
                - logs:UpdateLogDelivery
                - logs:DeleteLogDelivery
                - logs:ListLogDeliveries
                - logs:PutResourcePolicy
                - logs:DescribeResourcePolicies
                - logs:DescribeLogGroups
              Resource: "*"
            - Sid: XRayTracing
              Effect: Allow
              Action:
                - xray:PutTraceSegments
                - xray:PutTelemetryRecords
                - xray:GetSamplingRules
                - xray:GetSamplingTargets
              Resource: "*"
            - Sid: RunTranscribeJobs        # Transcribe job ARNs aren't known in advance
              Effect: Allow
              Action:
                - transcribe:StartTranscriptionJob
                - transcribe:GetTranscriptionJob
              Resource: "*"
            - Sid: TranscribeReadsAudioWritesTranscript   # Transcribe acts with the caller's S3 permissions
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub ${ProcessedBucket.Arn}/processed/*
            - Sid: InvokeCaptionFunctions
              Effect: Allow
              Action: lambda:InvokeFunction
              Resource:
                - !GetAtt PrepareTranscriptFunction.Arn
                - !GetAtt TranslateSubtitlesFunction.Arn
                - !GetAtt GenerateObjectivesFunction.Arn
                - !GetAtt ModerationFunction.Arn
            - Sid: RunSafetyCheckJobs       # Rekognition job IDs aren't known in advance
              Effect: Allow
              Action:
                - rekognition:StartContentModeration
                - rekognition:GetContentModeration
              Resource: "*"
            - Sid: SafetyCheckReadsUpload   # Rekognition reads the original video with the caller's S3 permissions
              Effect: Allow
              Action: s3:GetObject
              Resource: !Sub ${UploadBucket.Arn}/raw/*
      Events:
        VideoUploaded:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source: [aws.s3]
              detail-type: [Object Created]
              detail:
                bucket:
                  name: [!Ref UploadBucket]
                object:
                  key: [{ prefix: raw/ }]
            RetryPolicy:
              MaximumRetryAttempts: 3
              MaximumEventAgeInSeconds: 3600
            DeadLetterConfig:
              Type: SQS                     # SAM creates the queue; events that can't start the workflow land here

  # ===========================================================================
  # Steps 8-9: captions - Transcribe (English) then Translate (fr, es, it, el)
  # ===========================================================================

  # Cleans Transcribe's output for ClipSensei and publishes the English subtitles
  PrepareTranscriptFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub streamdojo-${Environment}-prepare-transcript
      CodeUri: src/prepare_transcript/
      Handler: app.handler
      Timeout: 60
      Environment:
        Variables:
          TABLE_NAME: !Ref AppTable
          MEDIA_BUCKET: !Ref ProcessedBucket
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: ReadAndWriteTranscripts
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub ${ProcessedBucket.Arn}/processed/*
            - Sid: UpdateLessonCaptions
              Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt AppTable.Arn

  # Translates the English subtitles into one language (called 4x in parallel)
  TranslateSubtitlesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub streamdojo-${Environment}-translate-subtitles
      CodeUri: src/translate_subtitles/
      Handler: app.handler
      Timeout: 300                          # long lessons have many cues
      Environment:
        Variables:
          TABLE_NAME: !Ref AppTable
          MEDIA_BUCKET: !Ref ProcessedBucket
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: ReadEnglishWriteTranslations
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub ${ProcessedBucket.Arn}/processed/*
            - Sid: Translate                # TranslateText doesn't support resource-level permissions
              Effect: Allow
              Action: translate:TranslateText
              Resource: "*"
            - Sid: AddSubtitleLanguage
              Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt AppTable.Arn

  # ===========================================================================
  # Steps 10-11: ClipSensei (Bedrock) drafts learning objectives; educators review and publish
  # ===========================================================================

  # ClipSensei: reads the transcript, drafts objectives + answer keys with Amazon Bedrock
  # Live transcoding % for the creator's tracker: MediaConvert progress events (every 10 s) -> the lesson
  TranscodeProgressFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub streamdojo-${Environment}-transcode-progress
      CodeUri: src/transcode_progress/
      Handler: app.handler
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: !Ref AppTable
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: SaveProgress             # only ever writes 3 progress fields, and only while PROCESSING
              Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt AppTable.Arn
      Events:
        TranscodeProgress:
          Type: EventBridgeRule             # MediaConvert sends job events to the default bus
          Properties:
            Pattern:
              source: [aws.mediaconvert]
              detail-type: [MediaConvert Job State Change]
              detail:
                status: [STATUS_UPDATE]
                userMetadata:
                  videoId: [{ exists: true }]   # only StreamDojo jobs carry a videoId

  # Safety check: summarises what Rekognition found and records CLEAN / FLAGGED / UNCHECKED on the lesson
  ModerationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub streamdojo-${Environment}-moderation
      CodeUri: src/moderation/
      Handler: app.handler
      Timeout: 60
      Environment:
        Variables:
          TABLE_NAME: !Ref AppTable
          MIN_CONFIDENCE: "80"              # ignore labels Rekognition is less sure about
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: ReadSafetyCheckResults   # job IDs aren't known in advance
              Effect: Allow
              Action: rekognition:GetContentModeration
              Resource: "*"
            - Sid: RecordSafetyCheck
              Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt AppTable.Arn

  GenerateObjectivesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub streamdojo-${Environment}-generate-objectives
      CodeUri: src/generate_objectives/
      Handler: app.handler
      Timeout: 120                          # an LLM call on a long transcript can take a while
      MemorySize: 512
      Environment:
        Variables:
          TABLE_NAME: !Ref AppTable
          EVENT_BUS_NAME: !Ref EventBus     # Step 20: announces business events
          KEYS_TABLE_NAME: !Ref AnswerKeysTable
          MEDIA_BUCKET: !Ref ProcessedBucket
          MODEL_ID: !Ref GenerationModelId
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: AnnounceBusinessEvents   # Step 20: only onto StreamDojo's own bus
              Effect: Allow
              Action: events:PutEvents
              Resource: !GetAtt EventBus.Arn
            - Sid: ReadTranscript
              Effect: Allow
              Action: s3:GetObject
              Resource: !Sub ${ProcessedBucket.Arn}/processed/*
            - Sid: InvokeClipSenseiModel    # only this EU inference profile and the Anthropic models behind it
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${GenerationModelId}
                - arn:aws:bedrock:*::foundation-model/anthropic.*
            - Sid: WriteDraftObjectives
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt AppTable.Arn
            - Sid: WriteAnswerKeys
              Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt AnswerKeysTable.Arn

  # Educator API: review queue, view/edit objectives with answer keys, publish
  EducatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub streamdojo-${Environment}-educator
      CodeUri: src/educator/
      Handler: app.handler
      Timeout: 15
      Environment:
        Variables:
          TABLE_NAME: !Ref AppTable
          EVENT_BUS_NAME: !Ref EventBus     # Step 20: announces business events
          KEYS_TABLE_NAME: !Ref AnswerKeysTable
          ALLOWED_ORIGIN: !Ref FrontendUrl
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: AnnounceBusinessEvents   # Step 20: only onto StreamDojo's own bus
              Effect: Allow
              Action: events:PutEvents
              Resource: !GetAtt EventBus.Arn
            - Sid: ReviewAndPublishLessons
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem     # Step 16c: remove a weak draft objective
              Resource:
                - !GetAtt AppTable.Arn
                - !Sub ${AppTable.Arn}/index/GSI1
            - Sid: ReadAndEditAnswerKeys
              Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:UpdateItem
                - dynamodb:PutItem        # Step 16c: an educator adds an objective (with its answer key)
                - dynamodb:DeleteItem     # Step 16c: ...or removes a draft one
              Resource: !GetAtt AnswerKeysTable.Arn
      Events:
        RejectLesson:
          Type: Api
          Properties:
            RestApiId: !Ref StreamDojoApi
            Path: /lessons/{videoId}/reject
            Method: post
        ListDrafts:
          Type: Api
          Properties:
            RestApiId: !Ref StreamDojoApi
            Path: /lessons
            Method: get
        GetObjectives:
          Type: Api
          Properties:
            RestApiId: !Ref StreamDojoApi
            Path: /lessons/{videoId}/objectives
            Method: get
        UpdateObjective:
          Type: Api
          Properties:
            RestApiId: !Ref StreamDojoApi
            Path: /lessons/{videoId}/objectives/{objectiveId}
            Method: put
        PublishLesson:
          Type: Api
          Properties:
            RestApiId: !Ref StreamDojoApi
            Path: /lessons/{videoId}/publish
            Method: post
        AddObjective:
          Type: Api
          Properties:
            RestApiId: !Ref StreamDojoApi
            Path: /lessons/{videoId}/objectives
            Method: post
        RenameLesson:
          Type: Api
          Properties:
            RestApiId: !Ref StreamDojoApi
            Path: /lessons/{videoId}
            Method: put
        DeleteObjective:
          Type: Api
          Properties:
            RestApiId: !Ref StreamDojoApi
            Path: /lessons/{videoId}/objectives/{objectiveId}
            Method: delete

  # ===========================================================================
  # Steps 12-13: learner practice (active recall), ClipSensei marking, spaced repetition
  # ===========================================================================

  # Read-only learner API: practice prompts and reviews due. Deliberately NO answer-keys access.
  LearnFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub streamdojo-${Environment}-learn
      CodeUri: src/learn/
      Handler: app.handler
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: !Ref AppTable
          ALLOWED_ORIGIN: !Ref FrontendUrl
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: ReadPublishedLessonsAndDueReviews
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
              Resource:
                - !GetAtt AppTable.Arn
                - !Sub ${AppTable.Arn}/index/GSI3
      Events:
        Practice:
          Type: Api
          Properties:
            RestApiId: !Ref StreamDojoApi
            Path: /learn/lessons/{videoId}/practice
            Method: get
        ReviewsDue:
          Type: Api
          Properties:
            RestApiId: !Ref StreamDojoApi
            Path: /learn/reviews/due
            Method: get
        Progress:
          Type: Api
          Properties:
            RestApiId: !Ref StreamDojoApi
            Path: /learn/progress
            Method: get

  # ClipSensei marking: the only learner-facing function that may read answer keys
  MarkingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub streamdojo-${Environment}-marking
      CodeUri: src/marking/
      Handler: app.handler
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref AppTable
          EVENT_BUS_NAME: !Ref EventBus     # Step 20: announces business events
          KEYS_TABLE_NAME: !Ref AnswerKeysTable
          MODEL_ID: !Ref MarkingModelId
          ALLOWED_ORIGIN: !Ref FrontendUrl
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: AnnounceBusinessEvents   # Step 20: only onto StreamDojo's own bus
              Effect: Allow
              Action: events:PutEvents
              Resource: !GetAtt EventBus.Arn
            - Sid: SaveAttemptsSchedulesAndStats
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Query          # Step 20: has this learner now practised every idea?
              Resource: !GetAtt AppTable.Arn
            - Sid: ReadAnswerKeysOnly       # read, never write
              Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt AnswerKeysTable.Arn
            - Sid: InvokeMarkingModel
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${MarkingModelId}
                - arn:aws:bedrock:*::foundation-model/anthropic.*
      Events:
        SubmitAttempt:
          Type: Api
          Properties:
            RestApiId: !Ref StreamDojoApi
            Path: /learn/attempts
            Method: post
        Hint:
          Type: Api
          Properties:
            RestApiId: !Ref StreamDojoApi
            Path: /learn/hint/{videoId}/{objectiveId}
            Method: get
        # Grading (dojo exam + belts): same function, so the exam uses exactly the same ClipSensei marking
        GradingStatus:
          Type: Api
          Properties:
            RestApiId: !Ref StreamDojoApi
            Path: /learn/grading/{topicId}
            Method: get
        GradingStart:
          Type: Api
          Properties:
            RestApiId: !Ref StreamDojoApi
            Path: /learn/grading/{topicId}/start
            Method: post
        GradingAnswer:
          Type: Api
          Properties:
            RestApiId: !Ref StreamDojoApi
            Path: /learn/grading/{topicId}/answer
            Method: post

  # ===========================================================================
  # Step 14: educator insights - read-only numbers + a ClipSensei summary
  # ===========================================================================
  InsightsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub streamdojo-${Environment}-insights
      CodeUri: src/insights/
      Handler: app.handler
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref AppTable
          KEYS_TABLE_NAME: !Ref AnswerKeysTable
          MODEL_ID: !Ref GenerationModelId
          ALLOWED_ORIGIN: !Ref FrontendUrl
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: ReadLessonStatsAndSchedules     # read only: Query on the main table
              Effect: Allow
              Action: dynamodb:Query
              Resource: !GetAtt AppTable.Arn
            - Sid: ReadEssentialPointWording       # read only: Query on the answer keys
              Effect: Allow
              Action: dynamodb:Query
              Resource: !GetAtt AnswerKeysTable.Arn
            - Sid: InvokeSummaryModel
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${GenerationModelId}
                - arn:aws:bedrock:*::foundation-model/anthropic.*
      Events:
        LessonInsights:
          Type: Api
          Properties:
            RestApiId: !Ref StreamDojoApi
            Path: /insights/lessons/{videoId}
            Method: get
        Leaderboard:                               # educators only (checked in the function): the class for one course
          Type: Api
          Properties:
            RestApiId: !Ref StreamDojoApi
            Path: /insights/leaderboard/{topicId}
            Method: get

  # ===========================================================================
  # Step 15: website hosting - ONE CloudFront address serves everything:
  #   /          the website (private S3 bucket, via OAC)
  #   /api/*     the REST API (same origin, so the browser needs no CORS)
  #   /media/*   video, thumbnails, subtitles (private media bucket, via OAC)
  # ===========================================================================
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub streamdojo-${Environment}-site-${AWS::AccountId}
      PublicAccessBlockConfiguration:       # never public: only CloudFront can read it
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub ${SiteBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: AllowOurCloudFrontOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}

  # Origin Access Control: CloudFront signs its requests to S3 (SigV4), so the buckets stay private.
  # One OAC can be shared by both S3 origins.
  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub streamdojo-${Environment}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Removes the /api or /media prefix before the request reaches its origin:
  #   /api/catalogue                  -> API Gateway  /dev/catalogue   (OriginPath adds /dev)
  #   /media/processed/x/hls/a.m3u8   -> media bucket processed/x/hls/a.m3u8
  StripPrefixFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub streamdojo-${Environment}-strip-prefix
      AutoPublish: true
      FunctionConfig:
        Comment: Strip /api or /media from the path
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          request.uri = request.uri.replace(/^\/(api|media)(?=\/|$)/, '') || '/';
          return request;
        }

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub StreamDojo ${Environment} - site, API and media
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100          # Europe + North America edges only: cheapest
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""      # empty = use OAC, not the legacy OAI
          - Id: media
            DomainName: !GetAtt ProcessedBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: api
            DomainName: !Sub ${StreamDojoApi}.execute-api.${AWS::Region}.amazonaws.com
            OriginPath: !Sub /${Environment}
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:               # the website itself
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6          # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy (HSTS, nosniff...)
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # Managed-CachingDisabled: never cache personal data
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # Managed-AllViewerExceptHostHeader: passes the Authorization header
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt StripPrefixFunction.FunctionMetadata.FunctionARN
          - PathPattern: /media/*
            TargetOriginId: media
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6          # video segments never change: cache hard
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt StripPrefixFunction.FunctionMetadata.FunctionARN

  # Read-only catalogue API for the home page and the player
  CatalogueFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub streamdojo-${Environment}-catalogue
      CodeUri: src/catalogue/
      Handler: app.handler
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: !Ref AppTable
          ALLOWED_ORIGIN: !Ref FrontendUrl
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: ReadPublishedCatalogue
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
              Resource:
                - !GetAtt AppTable.Arn
                - !Sub ${AppTable.Arn}/index/GSI1
      Events:
        ListCatalogue:
          Type: Api
          Properties:
            RestApiId: !Ref StreamDojoApi
            Path: /catalogue
            Method: get
        GetLesson:
          Type: Api
          Properties:
            RestApiId: !Ref StreamDojoApi
            Path: /catalogue/{videoId}
            Method: get

  # ===========================================================================
  # Step 20: business events and the in-app notification bell
  #   publishers (generate objectives, educator, marking) -> EventBridge bus -> notifier -> DynamoDB -> bell
  # ===========================================================================
  EventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub streamdojo-${Environment}-events

  # Consumer: decides who hears about each event and writes their bell notifications
  NotifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub streamdojo-${Environment}-notify
      CodeUri: src/notify/
      Handler: app.handler
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref AppTable
          USER_POOL_ID: !Ref UserPool
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: WriteNotificationsOnly
              Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt AppTable.Arn
              Condition:                  # only USER#... notification items, nothing else in the table
                ForAllValues:StringLike:
                  dynamodb:LeadingKeys: ["USER#*"]
            - Sid: FindEducators
              Effect: Allow
              Action: cognito-idp:ListUsersInGroup
              Resource: !GetAtt UserPool.Arn
      Events:
        BusinessEvents:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref EventBus
            Pattern:
              source: [streamdojo]
              detail-type: [LessonDraftReady, LessonPublished, LessonRejected, PracticeCompleted, LessonDeleted, BeltAwarded]
            RetryPolicy:
              MaximumRetryAttempts: 3
              MaximumEventAgeInSeconds: 3600
            DeadLetterConfig:
              Type: SQS                   # notifications that still fail land here, never lost silently

  # Deleting a video: removes its data, learner records, files and cached copies (LessonDeleted)
  CleanupFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub streamdojo-${Environment}-cleanup
      CodeUri: src/cleanup/
      Handler: app.handler
      Timeout: 300
      Environment:
        Variables:
          TABLE_NAME: !Ref AppTable
          KEYS_TABLE_NAME: !Ref AnswerKeysTable
          UPLOAD_BUCKET: !Ref UploadBucket
          MEDIA_BUCKET: !Ref ProcessedBucket
          DISTRIBUTION_ID: !Ref SiteDistribution
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: RemoveLessonData
              Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:DeleteItem
                - dynamodb:BatchWriteItem
              Resource:
                - !GetAtt AppTable.Arn
                - !GetAtt AnswerKeysTable.Arn
            - Sid: ListOnlyVideoFolders
              Effect: Allow
              Action: s3:ListBucket
              Resource:
                - !GetAtt UploadBucket.Arn
                - !GetAtt ProcessedBucket.Arn
              Condition:
                StringLike:
                  s3:prefix: [raw/*, processed/*]
            - Sid: DeleteVideoFiles
              Effect: Allow
              Action: s3:DeleteObject
              Resource:
                - !Sub ${UploadBucket.Arn}/raw/*
                - !Sub ${ProcessedBucket.Arn}/processed/*
            - Sid: ClearCachedCopies
              Effect: Allow
              Action: cloudfront:CreateInvalidation
              Resource: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}
      Events:
        LessonDeleted:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref EventBus
            Pattern:
              source: [streamdojo]
              detail-type: [LessonDeleted]
            RetryPolicy:
              MaximumRetryAttempts: 3
              MaximumEventAgeInSeconds: 3600
            DeadLetterConfig:
              Type: SQS                   # a cleanup that keeps failing waits here - never lost

  # API: what the bell reads - each user only ever sees their own notifications
  NotificationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub streamdojo-${Environment}-notifications
      CodeUri: src/notifications/
      Handler: app.handler
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: !Ref AppTable
          ALLOWED_ORIGIN: !Ref FrontendUrl
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: OwnNotificationsOnly
              Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:UpdateItem
              Resource: !GetAtt AppTable.Arn
              Condition:
                ForAllValues:StringLike:
                  dynamodb:LeadingKeys: ["USER#*"]
      Events:
        ListNotifications:
          Type: Api
          Properties:
            RestApiId: !Ref StreamDojoApi
            Path: /notifications
            Method: get
        MarkRead:
          Type: Api
          Properties:
            RestApiId: !Ref StreamDojoApi
            Path: /notifications/read
            Method: post

  # ===========================================================================
  # Step 19: operations - cost guardrail, alarms and a dashboard
  # ===========================================================================

  # CloudWatch alarms can't publish to an SNS topic encrypted with the AWS-MANAGED key (alias/aws/sns):
  # that key's policy can't be changed to let CloudWatch use it, so alarm emails would silently never arrive.
  # A customer-managed key (about $1/month) whose policy allows CloudWatch fixes that.
  AlertsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub StreamDojo ${Environment} - encrypts the alerts topic
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountAdministers
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"
          - Sid: CloudWatchAlarmsCanPublish
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey*
            Resource: "*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  AlertsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/streamdojo-${Environment}-alerts
      TargetKeyId: !Ref AlertsKey

  # Monthly cost guardrail for the whole account: email at 80% of actual spend
  # and as soon as AWS forecasts the month will go over the limit. (The first two budgets are free.)
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: HasAlertEmail
    Properties:
      Budget:
        BudgetName: !Sub streamdojo-${Environment}-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80                   # percent of the budget
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

  # Alarms - each one emails the alerts topic when it fires and again when it recovers
  PipelineFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub streamdojo-${Environment}-pipeline-failed
      AlarmDescription: A video processing run failed - check the Step Functions execution graph
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref ProcessVideoStateMachine
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching        # no runs = nothing wrong
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  PipelineDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub streamdojo-${Environment}-upload-events-dead-lettered
      AlarmDescription: An upload event could not start the pipeline after 3 retries - it is waiting in the dead-letter queue
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ProcessVideoStateMachineVideoUploadedQueue.QueueName   # the queue SAM created for the event rule
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  ApiServerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub streamdojo-${Environment}-api-5xx
      AlarmDescription: The API returned 5 or more server errors in 5 minutes
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: !Sub streamdojo-${Environment}-api
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  # Metric math: one alarm over the four functions learners and educators wait on
  UserFacingLambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub streamdojo-${Environment}-user-facing-lambda-errors
      AlarmDescription: Marking, learning, catalogue or educator functions errored 3+ times in 5 minutes
      Metrics:
        - Id: total
          Expression: marking + learn + catalogue + educator
          Label: Errors in user-facing functions
          ReturnData: true
        - Id: marking
          ReturnData: false
          MetricStat:
            Metric: {Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{Name: FunctionName, Value: !Ref MarkingFunction}]}
            Period: 300
            Stat: Sum
        - Id: learn
          ReturnData: false
          MetricStat:
            Metric: {Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{Name: FunctionName, Value: !Ref LearnFunction}]}
            Period: 300
            Stat: Sum
        - Id: catalogue
          ReturnData: false
          MetricStat:
            Metric: {Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{Name: FunctionName, Value: !Ref CatalogueFunction}]}
            Period: 300
            Stat: Sum
        - Id: educator
          ReturnData: false
          MetricStat:
            Metric: {Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{Name: FunctionName, Value: !Ref EducatorFunction}]}
            Period: 300
            Stat: Sum
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  # Bedrock refusing calls because we hit the tokens-per-minute quota (the scaling limit to watch)
  BedrockThrottledAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub streamdojo-${Environment}-bedrock-throttled
      AlarmDescription: Bedrock throttled ClipSensei - consider a quota increase or queueing marking requests
      Metrics:
        # Alarms can't use SEARCH(), but they can use a Metrics Insights query: this one adds up
        # throttles across every Bedrock model ID, so it works whatever inference profile is in use
        - Id: throttles
          Expression: SELECT SUM(InvocationThrottles) FROM SCHEMA("AWS/Bedrock", ModelId)
          Period: 300
          Label: Bedrock throttles
          ReturnData: true
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  OperationsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub streamdojo-${Environment}
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "text",
              "x": 0,
              "y": 0,
              "width": 24,
              "height": 2,
              "properties": {
                "markdown": "# StreamDojo (${Environment})\nUpload pipeline, API, ClipSensei (Bedrock) and video delivery. Alarms email the alerts topic; the monthly budget emails at 80% actual / 100% forecast."
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 2,
              "width": 8,
              "height": 6,
              "properties": {
                "title": "Pipeline runs (Step Functions)",
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  [
                    "AWS/States",
                    "ExecutionsStarted",
                    "StateMachineArn",
                    "${ProcessVideoStateMachine}",
                    {
                      "label": "Started"
                    }
                  ],
                  [
                    ".",
                    "ExecutionsSucceeded",
                    ".",
                    ".",
                    {
                      "label": "Succeeded",
                      "color": "#2ca02c"
                    }
                  ],
                  [
                    ".",
                    "ExecutionsFailed",
                    ".",
                    ".",
                    {
                      "label": "Failed",
                      "color": "#d62728"
                    }
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 8,
              "y": 2,
              "width": 8,
              "height": 6,
              "properties": {
                "title": "Pipeline duration (minutes, p50 / max)",
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "stat": "Average",
                "period": 300,
                "metrics": [
                  [
                    {
                      "expression": "m1/60000",
                      "label": "p50",
                      "id": "e1"
                    }
                  ],
                  [
                    {
                      "expression": "m2/60000",
                      "label": "max",
                      "id": "e2"
                    }
                  ],
                  [
                    "AWS/States",
                    "ExecutionTime",
                    "StateMachineArn",
                    "${ProcessVideoStateMachine}",
                    {
                      "id": "m1",
                      "stat": "p50",
                      "visible": false
                    }
                  ],
                  [
                    "...",
                    {
                      "id": "m2",
                      "stat": "Maximum",
                      "visible": false
                    }
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 16,
              "y": 2,
              "width": 8,
              "height": 6,
              "properties": {
                "title": "ClipSensei (Bedrock) calls and tokens",
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  [
                    {
                      "expression": "SEARCH('{AWS/Bedrock,ModelId} MetricName=\"Invocations\"', 'Sum', 300)",
                      "label": "Invocations",
                      "id": "invocations"
                    }
                  ],
                  [
                    {
                      "expression": "SEARCH('{AWS/Bedrock,ModelId} MetricName=\"InputTokenCount\"', 'Sum', 300)",
                      "label": "Input tokens",
                      "id": "inputtokens"
                    }
                  ],
                  [
                    {
                      "expression": "SEARCH('{AWS/Bedrock,ModelId} MetricName=\"OutputTokenCount\"', 'Sum', 300)",
                      "label": "Output tokens",
                      "id": "outputtokens"
                    }
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 8,
              "width": 8,
              "height": 6,
              "properties": {
                "title": "API requests and errors",
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  [
                    "AWS/ApiGateway",
                    "Count",
                    "ApiName",
                    "streamdojo-${Environment}-api",
                    {
                      "label": "Requests"
                    }
                  ],
                  [
                    ".",
                    "4XXError",
                    ".",
                    ".",
                    {
                      "label": "4xx (client)",
                      "color": "#ff7f0e"
                    }
                  ],
                  [
                    ".",
                    "5XXError",
                    ".",
                    ".",
                    {
                      "label": "5xx (server)",
                      "color": "#d62728"
                    }
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 8,
              "y": 8,
              "width": 8,
              "height": 6,
              "properties": {
                "title": "API latency (ms)",
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "stat": "p50",
                "period": 300,
                "metrics": [
                  [
                    "AWS/ApiGateway",
                    "Latency",
                    "ApiName",
                    "streamdojo-${Environment}-api",
                    {
                      "stat": "p50",
                      "label": "p50"
                    }
                  ],
                  [
                    "...",
                    {
                      "stat": "p95",
                      "label": "p95"
                    }
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 16,
              "y": 8,
              "width": 8,
              "height": 6,
              "properties": {
                "title": "Lambda errors by function",
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  [
                    {
                      "expression": "SEARCH('{AWS/Lambda,FunctionName} MetricName=\"Errors\" streamdojo-${Environment}', 'Sum', 300)",
                      "label": "Errors",
                      "id": "errors"
                    }
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 14,
              "width": 8,
              "height": 6,
              "properties": {
                "title": "Lambda duration p95 (ms) - watch for cold starts",
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  [
                    {
                      "expression": "SEARCH('{AWS/Lambda,FunctionName} MetricName=\"Duration\" streamdojo-${Environment}', 'p95', 300)",
                      "label": "Duration",
                      "id": "duration"
                    }
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 8,
              "y": 14,
              "width": 8,
              "height": 6,
              "properties": {
                "title": "Lambda throttles (concurrency limit)",
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  [
                    {
                      "expression": "SEARCH('{AWS/Lambda,FunctionName} MetricName=\"Throttles\" streamdojo-${Environment}', 'Sum', 300)",
                      "label": "Throttles",
                      "id": "throttles"
                    }
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 16,
              "y": 14,
              "width": 8,
              "height": 6,
              "properties": {
                "title": "DynamoDB reads, writes and throttles",
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  [
                    "AWS/DynamoDB",
                    "ConsumedReadCapacityUnits",
                    "TableName",
                    "${AppTable}",
                    {
                      "label": "Read units"
                    }
                  ],
                  [
                    ".",
                    "ConsumedWriteCapacityUnits",
                    ".",
                    ".",
                    {
                      "label": "Write units"
                    }
                  ],
                  [
                    ".",
                    "ThrottledRequests",
                    ".",
                    ".",
                    {
                      "label": "Throttled",
                      "color": "#d62728"
                    }
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 20,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Video delivery: CloudFront requests",
                "view": "timeSeries",
                "stacked": false,
                "region": "us-east-1",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  [
                    "AWS/CloudFront",
                    "Requests",
                    "DistributionId",
                    "${SiteDistribution}",
                    "Region",
                    "Global",
                    {
                      "label": "Requests"
                    }
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 20,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Video delivery: CloudFront error rate (%)",
                "view": "timeSeries",
                "stacked": false,
                "region": "us-east-1",
                "stat": "Average",
                "period": 300,
                "metrics": [
                  [
                    "AWS/CloudFront",
                    "4xxErrorRate",
                    "DistributionId",
                    "${SiteDistribution}",
                    "Region",
                    "Global",
                    {
                      "label": "4xx %"
                    }
                  ],
                  [
                    ".",
                    "5xxErrorRate",
                    ".",
                    ".",
                    ".",
                    ".",
                    {
                      "label": "5xx %",
                      "color": "#d62728"
                    }
                  ]
                ]
              }
            },
            {
              "type": "alarm",
              "x": 0,
              "y": 26,
              "width": 24,
              "height": 3,
              "properties": {
                "title": "Alarms",
                "alarms": [
                  "${PipelineFailedAlarm.Arn}",
                  "${PipelineDeadLetterAlarm.Arn}",
                  "${ApiServerErrorsAlarm.Arn}",
                  "${UserFacingLambdaErrorsAlarm.Arn}",
                  "${BedrockThrottledAlarm.Arn}"
                ]
              }
            }
          ]
        }

# -----------------------------------------------------------------------------
# Outputs: values other steps and the README will need
# -----------------------------------------------------------------------------
Outputs:
  AlertsTopicArn:
    Description: SNS topic that receives StreamDojo alerts
    Value: !Ref AlertsTopic
  ApiUrl:
    Description: Base URL of the StreamDojo REST API
    Value: !Sub https://${StreamDojoApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
  UserPoolId:
    Description: Cognito user pool ID
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito app client ID for the web app
    Value: !Ref UserPoolClient
  HostedLoginUrl:
    Description: Cognito hosted sign-in page
    Value: !Sub https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com/login?client_id=${UserPoolClient}&response_type=code&scope=openid+email+profile&redirect_uri=${FrontendUrl}/
  AppTableName:
    Description: Main DynamoDB table
    Value: !Ref AppTable
  AnswerKeysTableName:
    Description: Answer-keys DynamoDB table
    Value: !Ref AnswerKeysTable
  UploadBucketName:
    Description: Private bucket for original video uploads
    Value: !Ref UploadBucket

  ProcessedBucketName:
    Description: Private bucket for HLS streams, audio and thumbnails
    Value: !Ref ProcessedBucket
  ProcessVideoStateMachineArn:
    Description: The video processing workflow
    Value: !Ref ProcessVideoStateMachine
  SiteUrl:
    Description: The StreamDojo website (open this in a browser)
    Value: !Sub https://${SiteDistribution.DomainName}
  SiteBucketName:
    Description: Bucket the pipeline uploads the website to
    Value: !Ref SiteBucket
  SiteDistributionId:
    Description: CloudFront distribution to invalidate after each website upload
    Value: !Ref SiteDistribution
  CognitoDomain:
    Description: Cognito hosted sign-in domain the website redirects to
    Value: !Sub ${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com
  DashboardUrl:
    Description: CloudWatch operations dashboard
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=streamdojo-${Environment}
